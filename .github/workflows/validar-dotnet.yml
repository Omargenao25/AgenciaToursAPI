name: Validar TourSmart RD

on:
  push:
    branches:
      - feature/toursmart-integrador-ii
  pull_request:
    branches:
      - master
      - feature/toursmart-integrador-ii

permissions:
  contents: read

jobs:
  build:
    name: Compilación Release (.NET 8)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Preparar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restaurar dependencias
        run: dotnet restore AgenciaToursAPI.sln
      - name: Compilar solución
        run: dotnet build AgenciaToursAPI.sln --configuration Release --no-restore -warnaserror
      # El repositorio tiene deuda de estilo previa. No bloquear la compilación
      # por formato hasta que exista una normalización separada y revisada.
      - name: Diagnóstico de formato (informativo)
        continue-on-error: true
        run: dotnet format AgenciaToursAPI.sln --verify-no-changes --no-restore --severity error

      - name: Publicar API para validar entregable
        run: dotnet publish AgenciaToursAPI.csproj --configuration Release --no-restore --output ./out/api
      - name: Publicar Web para validar entregable
        run: dotnet publish TourSmart.Web/TourSmart.Web.csproj --configuration Release --no-restore --output ./out/web
      - name: Verificar entregables esenciales
        shell: bash
        run: |
          test -f out/api/AgenciaToursAPI.dll
          test -f out/web/TourSmart.Web.dll
          test -f out/web/wwwroot/css/toursmart-v3.css
          echo "Publicacion API y Web generada correctamente (sin despliegue)."
